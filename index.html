<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JRCC Book Track — Library Borrowing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --bg:#0a1f17;
  --bg-raised:#0f2a20;
  --panel:#133225;
  --panel-2:#173d2c;
  --line:#255241;
  --line-soft:#1e4536;
  --cream:#f4eedb;
  --ink:#eef2ec;
  --ink-dim:#a3bdac;
  --ink-faint:#6a8577;
  --gold:#c9a227;
  --gold-bright:#e2bc3f;
  --gold-ink:#241c04;
  --green-accent:#36d17e;
  --green-accent-ink:#bdf5d6;
  --blue-accent:#4fb4db;
  --blue-accent-ink:#cdeefb;
  --red:#e2574a;
  --red-ink:#fbdcd4;
  --green-ok:#4caf7d;
  --radius-s:4px;
  --radius-m:10px;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 1100px 500px at 50% -12%, rgba(201,162,39,.10), transparent 60%),
    radial-gradient(ellipse 900px 500px at 100% 10%, rgba(54,209,126,.06), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',serif;
  font-weight:600;
  margin:0;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold);color:var(--gold-ink);}

#app{min-height:100%;display:flex;flex-direction:column;}
.hidden{display:none !important;}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg-raised) 0%, rgba(15,42,32,.97) 100%);
  padding-top:env(safe-area-inset-top,0px);
  position:sticky;top:0;z-index:40;
}
.masthead-inner{
  width:100%;max-width:none;margin:0;padding:10px 18px;
  display:flex;align-items:center;gap:8px;
}
.crest{width:42px;height:42px;border-radius:50%;flex-shrink:0;object-fit:cover;box-shadow:0 0 0 2px var(--gold), 0 0 0 3px var(--line);transition:transform .25s ease,box-shadow .25s ease;}
.crest:hover{transform:scale(1.04);box-shadow:0 0 0 2px var(--gold-bright),0 0 14px rgba(201,162,39,.28);}
.brand-text{display:flex;flex-direction:column;line-height:1.15;cursor:pointer;}
.brand-text .name{font-family:'Fraunces',serif;font-weight:700;font-size:18px;letter-spacing:.01em;}
.brand-text .name b{color:var(--gold);font-weight:700;}
.brand-text .tag{font-size:10px;color:var(--ink-faint);letter-spacing:.1em;margin-top:2px;font-family:'JetBrains Mono',monospace;}
.masthead-spacer{flex:1;}
.masthead-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;}
.pill-btn{
  position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;
  transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease;
  animation:navButtonFloat 4s ease-in-out infinite;
}
.pill-btn::after{
  content:"";position:absolute;inset:-1px;border-radius:9px;padding:1px;z-index:-1;
  background:linear-gradient(120deg,transparent 15%,rgba(255,255,255,.42),transparent 85%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .25s ease,transform .4s ease;
}
.pill-btn:hover{transform:translateY(-2px);border-color:var(--gold-bright);box-shadow:0 7px 18px rgba(0,0,0,.22),0 0 0 1px rgba(201,162,39,.16);}
.pill-btn:hover::after{opacity:1;transform:translateX(8%);}
.pill-btn:active{transform:translateY(0) scale(.97);}
#btnCatalog{border-color:rgba(201,162,39,.65);box-shadow:0 0 0 1px rgba(201,162,39,.06);}
#btnCatalog:hover{border-color:var(--gold-bright);box-shadow:0 0 14px rgba(201,162,39,.20),0 7px 18px rgba(0,0,0,.22);}
#btnMyLoans{border-color:rgba(79,180,219,.58);}
#btnMyLoans:hover{border-color:var(--blue-accent);box-shadow:0 0 14px rgba(79,180,219,.18),0 7px 18px rgba(0,0,0,.22);}
#btnChangePass{border-color:rgba(54,209,126,.48);}
#btnChangePass:hover{border-color:var(--green-accent);box-shadow:0 0 14px rgba(54,209,126,.16),0 7px 18px rgba(0,0,0,.22);}
#btnLogout{border-color:rgba(226,87,74,.52);}
#btnLogout:hover{border-color:var(--red);color:#ffe7e2;box-shadow:0 0 14px rgba(226,87,74,.17),0 7px 18px rgba(0,0,0,.22);}
.pill-btn.accent{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700;}
.nav-icon{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease;}
.pill-btn:hover .nav-icon{transform:translateY(-1px) scale(1.06);}
.pill-btn:active .nav-icon{transform:scale(.94);}
@media(max-width:640px){.nav-icon{width:15px;height:15px;flex-basis:15px;}.pill-btn{gap:6px;}}
.pill-btn.accent:hover{background:var(--gold-bright);}
.profile-nav{height:36px;min-height:36px;padding:8px 13px;border:1px solid rgba(79,180,219,.58);box-shadow:0 0 0 1px rgba(79,180,219,.06);}
.profile-nav:hover{border-color:var(--blue-accent);box-shadow:0 0 14px rgba(79,180,219,.18),0 7px 18px rgba(0,0,0,.22);}
.profile-nav[aria-expanded="true"]{border-color:var(--blue-accent);box-shadow:0 0 0 1px rgba(79,180,219,.14),0 0 14px rgba(79,180,219,.12);}
.profile-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid rgba(226,188,63,.8);background:#0b2a1f;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gold-bright);overflow:hidden;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-modal{max-width:560px;}
.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.profile-big-avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;background:var(--panel-2);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 82px;color:var(--gold);font-size:26px;font-weight:700;}
.profile-big-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-title small{display:block;color:var(--ink-faint);font-size:11px;margin-top:4px;}
.profile-upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
.profile-upload input[type=file]{max-width:210px;font-size:11px;}
.profile-view-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:10px;}
.profile-view-item{padding:9px 0;border-bottom:1px solid var(--line-soft);}
.profile-view-item label{display:block;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
.profile-view-item div{font-size:13px;color:var(--ink);word-break:break-word;}
.profile-wrap{position:relative;display:inline-block;}
.profile-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(0,0,0,.24);z-index:1000;display:none;}
.profile-menu.open{display:block;animation:profileDrop .16s ease-out;}
.profile-menu button{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:0;border-radius:8px;padding:10px 11px;color:var(--ink);font:inherit;font-size:12px;text-align:left;cursor:pointer;}
.profile-menu button:hover{background:var(--panel-2);color:var(--gold-dark);}
.profile-menu .menu-divider{height:1px;background:var(--line-soft);margin:5px 4px;}
.profile-menu svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px;}
@keyframes profileDrop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.profile-security{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);}
.profile-security-title{font-size:12px;font-weight:700;margin-bottom:4px;}
.profile-security-text{font-size:11px;color:var(--ink-faint);margin-bottom:9px;}
@media(max-width:520px){.profile-view-grid{grid-template-columns:1fr}.profile-modal{padding:20px}.profile-big-avatar{width:68px;height:68px;flex-basis:68px}.profile-nav span:last-child{display:none;}}

@keyframes navButtonFloat{0%,100%{box-shadow:0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 3px 10px rgba(0,0,0,.08)}}
@media (prefers-reduced-motion:reduce){.pill-btn{animation:none;transition:none}.pill-btn:hover{transform:none}.crest{transition:none}}

@media(max-width:640px){
  .masthead-inner{padding:8px 10px;gap:6px;}
  .crest{width:38px;height:38px;}
  .brand-text .name{font-size:16px;}
  .brand-text .tag{font-size:8px;}
  .masthead-actions{gap:4px;}
  .pill-btn{padding:7px 9px;font-size:11.5px;}
  .user-chip{display:none;}
}
.badge-count{
  background:var(--red);color:#fff;border-radius:999px;min-width:17px;height:17px;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;
  font-family:'JetBrains Mono',monospace;
}
.user-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;margin-right:2px;}
.user-chip .who{font-size:13px;font-weight:600;}
.user-chip .role{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;}

main{flex:1;width:100%;}
.wrap{max-width:1160px;margin:0 auto;padding:28px 20px 60px;}
.wrap-narrow{max-width:460px;margin:0 auto;padding:44px 20px 60px;}

/* ---------- buttons / forms ---------- */
.btn{
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  padding:11px 18px;border-radius:var(--radius-s);font-size:14px;font-weight:600;
  transition:border-color .15s,background .15s,opacity .15s;
}
.btn:hover{border-color:var(--ink-faint);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);}
.btn-gold:hover{background:var(--gold-bright);}
.btn-block{width:100%;}
.btn-ghost{background:transparent;}
.btn-danger{border-color:#5c2a22;color:#ff9d8c;}
.btn-danger:hover{border-color:var(--red);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:3px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;letter-spacing:.02em;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:11px 12px;border-radius:var(--radius-s);font-size:14.5px;outline:none;
  transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.hint{font-size:12px;color:var(--ink-faint);margin-top:6px;}
.err{background:#2e1512;border:1px solid #5c2a22;color:#ff9d8c;padding:10px 12px;border-radius:var(--radius-s);font-size:13px;margin-bottom:14px;}
.ok{background:#0f2e20;border:1px solid #245a3a;color:#8fe0b4;padding:10px 12px;border-radius:var(--radius-s);font-size:13px;margin-bottom:14px;}

/* ---------- auth ---------- */
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:32px 28px;}
.auth-head{text-align:center;margin-bottom:24px;}
.auth-head h1{font-size:21px;}
.auth-head p{color:var(--ink-dim);font-size:13px;margin-top:6px;}
.demo-note{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}

/* -- auth hero: photo banner with bold editorial headline, JRCC-site inspired -- */
.auth-hero{position:relative;overflow:hidden;min-height:400px;display:flex;align-items:center;}
.auth-hero-bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:heroKenBurns 22s ease-in-out infinite alternate;
  transform-origin:60% 40%;
}
@keyframes heroKenBurns{
  0%{transform:scale(1.0) translate(0,0);}
  100%{transform:scale(1.12) translate(-1.5%,-1%);}
}
@media (prefers-reduced-motion: reduce){ .auth-hero-bg{ animation:none; } }
.auth-hero-scrim{
  position:absolute;inset:0;
  background:
    linear-gradient(100deg, rgba(10,31,23,.96) 0%, rgba(10,31,23,.86) 30%, rgba(10,31,23,.45) 60%, rgba(10,31,23,.15) 100%),
    linear-gradient(0deg, rgba(10,31,23,.55) 0%, transparent 45%);
}
.auth-hero-inner{position:relative;max-width:1160px;margin:0 auto;padding:0 20px;width:100%;}
.auth-hero-content{max-width:600px;padding:56px 0;}
.auth-hero-eyebrow{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--gold-bright);text-transform:uppercase;}
.auth-hero-eyebrow .dash{width:30px;height:1.5px;background:var(--gold-bright);display:inline-block;flex-shrink:0;}
.auth-hero-title{font-size:clamp(32px,6vw,54px);margin-top:16px;color:#fff;line-height:1.05;text-shadow:0 2px 16px rgba(0,0,0,.5);letter-spacing:-.01em;}
.auth-hero-title b{color:var(--gold-bright);}
.auth-hero-sub{margin-top:18px;font-size:14.5px;max-width:460px;color:var(--cream);opacity:.92;line-height:1.65;}
.auth-hero-ctas{margin-top:28px;display:flex;gap:14px;flex-wrap:wrap;}
.auth-hero-btn{padding:13px 24px;border-radius:6px;font-size:13.5px;font-weight:700;letter-spacing:.02em;}
.auth-hero-btn.gold{background:var(--gold);color:var(--gold-ink);}
.auth-hero-btn.gold:hover{background:var(--gold-bright);}
.auth-hero-btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.4);}
.auth-hero-btn.ghost:hover{background:rgba(255,255,255,.16);}
@media(max-width:640px){.auth-hero{min-height:340px;}.auth-hero-content{padding:40px 0;}}

/* ---------- tabs / nav ---------- */
.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap;}
.tabbtn{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;border-left:none;border-right:none;border-top:none;}
.tabbtn.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ---------- cards / grids ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-bottom:24px;}
@media(max-width:640px){.stat-strip{grid-template-columns:repeat(2,1fr);}}
.stat-cell{background:var(--panel);padding:18px 16px;border-top:3px solid transparent;}
.stat-cell .num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;}
.stat-cell .lbl{font-size:11px;color:var(--ink-faint);letter-spacing:.06em;margin-top:4px;text-transform:uppercase;}
.stat-cell.acc-gold{border-top-color:var(--gold);}
.stat-cell.acc-blue{border-top-color:var(--blue-accent);}
.stat-cell.acc-green{border-top-color:var(--green-accent);}
.stat-cell.acc-blue .num{color:var(--blue-accent-ink);}
.stat-cell.acc-green .num{color:var(--green-accent-ink);}
.stat-cell.warn{border-top-color:var(--red);}
.stat-cell.warn .num{color:var(--red);}

.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.book-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;display:flex;flex-direction:column;gap:8px;}
.book-spine{width:100%;height:6px;border-radius:3px;background:var(--gold);opacity:.8;}
.book-cover{width:100%;border-radius:6px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.4);aspect-ratio:3/4;background:var(--panel-2);}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);}
.cover-placeholder svg{width:34%;height:34%;opacity:.4;}
.cover-upload-preview{width:96px;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cover-upload-preview img{width:100%;height:100%;object-fit:cover;}
.cover-upload-preview svg{width:36%;height:36%;color:var(--ink-faint);opacity:.4;}
.cover-upload-row{display:flex;gap:12px;align-items:flex-start;}
.cover-upload-controls{flex:1;display:flex;flex-direction:column;gap:8px;}
input[type=file]{color:var(--ink-dim);font-size:12px;}
input[type=file]::file-selector-button{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:6px 11px;border-radius:4px;font-size:12.5px;font-weight:600;margin-right:8px;cursor:pointer;
}
input[type=file]::file-selector-button:hover{border-color:var(--ink-faint);}
.book-card h3{font-size:15.5px;line-height:1.3;}
.book-card .author{font-size:12.5px;color:var(--ink-dim);}
.book-card .cat{font-size:10.5px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.book-card .avail{font-size:12px;color:var(--ink-faint);margin-top:auto;padding-top:6px;}
.book-card .avail.out{color:var(--red);}

.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td{padding:12px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
tbody tr:hover{background:rgba(201,162,39,.045);}
tbody tr.row-clickable{cursor:pointer;}
tbody tr.row-clickable:hover{background:rgba(201,162,39,.09);}
.status-chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.status-chip.onloan{background:#1c3e57;color:#8fc3ff;}
.status-chip.returned{background:#0f2e20;color:#8fe0b4;}
.status-chip.overdue{background:#3a1712;color:#ff9d8c;}

.empty-state{text-align:center;color:var(--ink-faint);padding:40px 20px;font-size:13.5px;}

/* ---------- modal / toast ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(5,13,10,.65);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:26px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;}
.modal h3{font-size:18px;margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.co-line{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--ink-dim);}
.co-line span:last-child{color:var(--ink);}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:var(--gold-ink);padding:11px 20px;border-radius:20px;
  font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.35);
}

footer{border-top:1px solid var(--line);padding:20px;text-align:center;font-size:11.5px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}

/* ---------- life: subtle motion throughout ---------- */
@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.animate-in{animation:fadeSlideUp .38s ease both;}
@media (prefers-reduced-motion: reduce){ .animate-in{animation:none;} }

.admin-side-link:hover{transform:translateX(3px)}
.admin-side-link.active:after{content:"";position:absolute;right:0;top:18%;height:64%;width:3px;background:#d7b45a;border-radius:3px;box-shadow:0 0 12px rgba(215,180,90,.45)}
.premium-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.premium-stat{position:relative;overflow:hidden;border:1px solid rgba(6,67,50,.09);border-radius:14px;padding:17px;background:#fff;box-shadow:0 8px 24px rgba(6,67,50,.06);transition:transform .22s ease,box-shadow .22s ease}
.premium-stat:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(6,67,50,.11)}
.premium-stat:before{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:rgba(215,180,90,.10)}
.premium-stat .ps-icon{font-size:22px;margin-bottom:8px}.premium-stat .ps-label{font-size:11px;color:#819187;text-transform:uppercase;letter-spacing:.08em}.premium-stat .ps-value{font-size:28px;font-weight:800;color:#123f32;line-height:1.1;margin-top:4px}.premium-stat .ps-sub{font-size:10px;color:#819187;margin-top:5px}
.dashboard-two{display:grid;grid-template-columns:1.35fr .85fr;gap:14px;margin-bottom:14px}
.chart-card,.quick-card{background:#fff;border:1px solid rgba(6,67,50,.09);border-radius:14px;box-shadow:0 8px 24px rgba(6,67,50,.05);padding:16px}
.chart-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.chart-title h3{margin:0;font-size:14px;color:#153f33}.chart-title span{font-size:10px;color:#819187}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 2px 0}.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bar{width:100%;max-width:34px;min-height:4px;background:linear-gradient(180deg,#d7b45a,#064332);border-radius:7px 7px 3px 3px;transform-origin:bottom;animation:barRise .65s cubic-bezier(.2,.8,.2,1) both}.bar-value{font-size:9px;color:#456056}.bar-label{font-size:9px;color:#819187}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick-action{border:1px solid #e3ebe6;background:#f9fbfa;border-radius:11px;padding:12px;text-align:left;cursor:pointer;transition:all .2s ease;color:#153f33}.quick-action:hover{border-color:#d7b45a;background:#fff;transform:translateY(-2px)}.quick-action b{display:block;font-size:12px}.quick-action span{font-size:10px;color:#819187}.attention-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf1ee}.attention-item:last-child{border-bottom:0}.attention-dot{width:8px;height:8px;border-radius:50%;background:#d7b45a;margin-top:5px;flex:none}.attention-dot.red{background:#b84a4a}.attention-item b{font-size:11px}.attention-item p{font-size:10px;color:#819187;margin:2px 0 0}.email-center{display:grid;grid-template-columns:1fr 1fr;gap:14px}.email-template{border:1px solid #e3ebe6;border-radius:12px;padding:14px;background:#fbfcfb}.email-template h4{margin:0 0 5px;font-size:13px}.email-template p{font-size:11px;color:#6e7c75;line-height:1.55;margin:0 0 12px}.email-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf1ee}.email-row:last-child{border-bottom:0}.email-meta strong{font-size:11px}.email-meta small{display:block;color:#819187;font-size:9px;margin-top:2px}.pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d7b45a;box-shadow:0 0 0 0 rgba(215,180,90,.55);animation:pulseDot 1.8s infinite}
@keyframes barRise{from{transform:scaleY(0);opacity:.2}to{transform:scaleY(1);opacity:1}}@keyframes pulseDot{70%{box-shadow:0 0 0 7px rgba(215,180,90,0)}100%{box-shadow:0 0 0 0 rgba(215,180,90,0)}}
@media(max-width:1000px){.premium-grid{grid-template-columns:repeat(2,1fr)}.dashboard-two,.email-center{grid-template-columns:1fr}}
@media(max-width:600px){.premium-grid{grid-template-columns:1fr 1fr}.premium-stat .ps-value{font-size:22px}.quick-grid{grid-template-columns:1fr}.bar-chart{gap:5px}}

</style>

      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.max(1, Math.round(img.width*scale));
        const h = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function persistBooks(){ save('jrcc_books', books); }

function persistAnnouncements(){ save('jrcc_announcements', announcements); }
let userNotifications = load('jrcc_user_notifications', {});
if (!userNotifications || typeof userNotifications !== 'object' || Array.isArray(userNotifications)) userNotifications = {};
function persistUserNotifications(){ save('jrcc_user_notifications', userNotifications); }
function addUserNotification(username, title, text){
  if(!username) return;
  if(!Array.isArray(userNotifications[username])) userNotifications[username]=[];
  userNotifications[username].unshift({id:uid('n'), title, text, createdAt:Date.now(), read:false});
  userNotifications[username]=userNotifications[username].slice(0,30);
  persistUserNotifications();
}
function accountEmail(username){ const a=accounts.find(x=>x.username===username); return a && a.email ? a.email.trim() : ''; }
function openGmailReminder(loan){
  const member=accounts.find(a=>a.username===loan.username);
  const to=member?.email?.trim()||'';
  const status=computeStatus(loan);
  const subject=status==='overdue'?`JRCC Library: Overdue Book - ${loan.bookTitle}`:`JRCC Library: Due Date Reminder - ${loan.bookTitle}`;
  const body=status==='overdue'
    ? `Dear ${member?.fullname||loan.studentName},%0D%0A%0D%0AThis is a reminder from the JRCC Library that the book "${loan.bookTitle}" was due on ${fmtDate(loan.dueAt)}. Please return the book as soon as possible.%0D%0A%0D%0AThank you,%0D%0AJRCC Library`
    : `Dear ${member?.fullname||loan.studentName},%0D%0A%0D%0AThis is a reminder from the JRCC Library that the book "${loan.bookTitle}" is due on ${fmtDate(loan.dueAt)}. Please return it on or before the due date.%0D%0A%0D%0AThank you,%0D%0AJRCC Library`;
  addUserNotification(loan.username, status==='overdue'?'Overdue book reminder':'Due date reminder', `${loan.bookTitle} — due ${fmtDate(loan.dueAt)}. The admin prepared an email reminder.`);
  const gmail=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to)}&su=${encodeURIComponent(subject)}&body=${body}`;
  window.open(gmail,'_blank','noopener');
  toast(to ? `Gmail opened for ${member.fullname}.` : 'Gmail opened. Add the member email address before sending.');
}
function sendLoanReminder(loanId){ const loan=loans.find(l=>l.id===loanId); if(!loan || loan.returnedAt) return; const email=accountEmail(loan.username); if(!email){ openProfileModal(loan.username); toast('This member has no email address. Add one in their profile first.'); return; } openGmailReminder(loan); }
function isFavorite(bookId){ return !!(currentUser && Array.isArray(favorites[currentUser.username]) && favorites[currentUser.username].includes(bookId)); }
function studentNotificationCount(){ if(!currentUser)return 0; return announcements.length + userNotices().length; }

function toggleFavorite(bookId){ if(!currentUser)return; const arr=Array.isArray(favorites[currentUser.username])?favorites[currentUser.username]:[]; const i=arr.indexOf(bookId); if(i>=0)arr.splice(i,1); else arr.push(bookId); favorites[currentUser.username]=arr; persistFavorites(); }
function hasReservation(bookId){ return reservations.some(r=>r.bookId===bookId && r.username===currentUser.username && r.status==='waiting'); }
function dueSoon(l){ return !l.returnedAt && l.dueAt-Date.now()<=2*86400000 && l.dueAt>=Date.now(); }
function userNotices(){ if(!currentUser)return []; const out=[]; loans.filter(l=>l.username===currentUser.username && !l.returnedAt).forEach(l=>{const st=computeStatus(l); if(st==='overdue')out.push({type:'overdue',title:'Overdue book',text:`${l.bookTitle} was due ${fmtDate(l.dueAt)}.`}); else if(dueSoon(l))out.push({type:'due',title:'Due date reminder',text:`${l.bookTitle} is due ${fmtDate(l.dueAt)}.`});}); reservations.filter(r=>r.username===currentUser.username && r.status==='waiting').forEach(r=>out.push({type:'reserve',title:'Reservation active',text:`You are waiting for ${r.bookTitle}.`})); (userNotifications[currentUser.username]||[]).slice(0,5).forEach(n=>out.push({type:'manual',title:n.title,text:n.text})); return out; }

function saveSession(u){ if(LS) try{ LS.setItem('jrcc_session', u); }catch(e){} }
function clearSession(){ if(LS) try{ LS.removeItem('jrcc_session'); }catch(e){} }
function loadSession(){ if(LS) try{ return LS.getItem('jrcc_session'); }catch(e){return null;} return null; }

function computeStatus(loan){
  if (loan.returnedAt) return 'returned';
  if (Date.now() > loan.dueAt) return 'overdue';
  return 'onloan';
}

}

      </div>`);
    const emailReminderBtn=document.getElementById('emailDueReminder');
    if(emailReminderBtn) emailReminderBtn.onclick=()=>{ const active=mine.filter(l=>!l.returnedAt).sort((a,b)=>a.dueAt-b.dueAt)[0]; sendLoanReminder(active.id); };
    return;
  }

  openModal(`
    <div class="profile-modal">
      <h3>Edit Profile</h3>

        <div class="profile-big-avatar" id="profilePreview">${photo?`<img src="${photo}" alt="Profile photo">`:esc(profileInitials(m))}</div>
        <div class="profile-title"><div style="font-size:14px;font-weight:700;">${esc(m.fullname||m.username)}</div><small>@${esc(m.username)}</small>
          <div class="profile-upload"><input type="file" id="profilePhotoFile" accept="image/*"><button class="btn btn-sm btn-ghost" type="button" id="profilePhotoRemove">Remove photo</button></div>
        </div>

      <div class="field-row"><div class="field"><label>Email (for library reminders)</label><input id="pfEmail" type="email" value="${esc(m.email||'')}"></div><div class="field"><label>Contact Number</label><input id="pfContact" value="${esc(m.contact||'')}"></div></div>

      <div class="modal-actions"><button class="btn" id="modalCloseBtn">Cancel</button><button class="btn btn-gold" id="pfSave">Save Profile</button></div>

function renderAuth(mode){
  mode = mode || renderAuth._mode || 'login';
  renderAuth._mode = mode;
  const el = document.getElementById('viewAuth');
  el.innerHTML = `
  <div class="auth-hero">
    <img class="auth-hero-bg" src="${HERO_URI}" alt="">
    <div class="auth-hero-scrim"></div>
    <div class="auth-hero-inner">
      <div class="auth-hero-content animate-in">
        <div class="auth-hero-eyebrow"><span class="dash"></span>Jesus Reigns Christian College · Library</div>
        <h1 class="auth-hero-title">JRCC <b>Book Track</b></h1>
        <p class="auth-hero-sub">LIBRARY MANAGEMENT SYSTEM<br>Access books, manage your loans, and grow in knowledge — for His glory.</p>
        <div class="auth-hero-ctas">
          <button class="auth-hero-btn gold" id="heroLoginBtn">Log In</button>
          <button class="auth-hero-btn ghost" id="heroSignupBtn">Create Account</button>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap-narrow auth-float">
    <div class="auth-card">
      <div class="login-mark">▣</div>
      <div id="authFormHost"></div>
      <div class="demo-note">JRCC Book Track · Library Borrowing System<br>For School Use Only</div>
    </div>
  </div>`;
  const heroLogin = document.getElementById('heroLoginBtn');
  const heroSignup = document.getElementById('heroSignupBtn');
  if (heroLogin) heroLogin.onclick = ()=>{ renderAuth('login'); document.getElementById('authFormHost').scrollIntoView({behavior:'smooth', block:'center'}); };
  if (heroSignup) heroSignup.onclick = ()=>{ renderAuth('register'); document.getElementById('authFormHost').scrollIntoView({behavior:'smooth', block:'center'}); };
  if (mode==='login') renderLoginForm();
  else if (mode==='register') renderRegisterForm();
  else { renderForgotForm._state = null; renderForgotForm(); }
}

function renderLoginForm(){
  const host = document.getElementById('authFormHost');
  host.innerHTML = `
    <div id="authErr"></div>
    <div class="field"><label>Username</label><input id="lgUser" type="text" autocomplete="username" placeholder="e.g. juan_delacruz"></div>
    <div class="field"><label>Password</label><input id="lgPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-gold btn-block" id="lgSubmit">Log In</button>
    <div style="text-align:center;margin-top:12px;">
      <a href="#" id="lgForgotLink" style="font-size:12.5px;color:var(--gold);text-decoration:underline;">Forgot password?</a>
    </div>
    <div class="auth-switch">New student? <a href="#" id="lgSignupLink">Create an account</a></div>
  `;
  document.getElementById('lgSubmit').onclick = handleLogin;
  document.getElementById('lgForgotLink').onclick = (e)=>{ e.preventDefault(); renderAuth('forgot'); };
  document.getElementById('lgSignupLink').onclick = (e)=>{ e.preventDefault(); renderAuth('register'); };
  host.addEventListener('keydown', e=>{ if(e.key==='Enter') handleLogin(); });
}

function renderRegisterForm(){
  const host = document.getElementById('authFormHost');
  host.innerHTML = `
    <div id="authErr"></div>
    <div class="field"><label>Full name</label><input id="rgName" type="text" placeholder="Juan Dela Cruz"></div>
    <div class="field"><label>Student / LRN number</label><input id="rgLRN" type="text" placeholder="e.g. 2026-00345"></div>
    <div class="field-row">
      <div class="field"><label>Username</label><input id="rgUser" type="text" placeholder="Choose a username"></div>
      <div class="field"><label>Password</label><input id="rgPass" type="password" placeholder="••••••••"></div>
    </div>
    <div class="field"><label>Security Question (for password recovery)</label>
      <select id="rgSecQ">${SECURITY_QUESTIONS.map(q=>`<option>${esc(q)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Answer</label><input id="rgSecA" type="text" placeholder="Your answer"></div>
    <button class="btn btn-gold btn-block" id="rgSubmit">Create Account</button>
    <div class="auth-switch">Already have an account? <a href="#" id="rgLoginLink">Log in</a></div>
  `;
  document.getElementById('rgSubmit').onclick = handleRegister;
  document.getElementById('rgLoginLink').onclick = (e)=>{ e.preventDefault(); renderAuth('login'); };
}

function authError(msg){ document.getElementById('authErr').innerHTML = `<div class="err">${esc(msg)}</div>`; }

function handleLogin(){
  const u = document.getElementById('lgUser').value.trim().toLowerCase();
  const p = document.getElementById('lgPass').value;
  if (!u || !p){ authError('Enter both username and password.'); return; }
  const acc = accounts.find(a=>a.username===u);
  if (!acc || acc.password!==p){ authError('Invalid username or password.'); return; }
  currentUser = acc;
  saveSession(acc.username);
  renderCurrentScreen();
  toast(`Welcome, ${acc.fullname||acc.username}.`);
}

function handleRegister(){
  const fullname = document.getElementById('rgName').value.trim();
  const lrn = document.getElementById('rgLRN').value.trim();
  const username = document.getElementById('rgUser').value.trim().toLowerCase();
  const pass = document.getElementById('rgPass').value;
  const secQ = document.getElementById('rgSecQ').value;
  const secA = document.getElementById('rgSecA').value.trim();
  if (!fullname || !username || !pass){ authError('Full name, username and password are required.'); return; }
  if (!/^[a-z0-9_.]{3,20}$/.test(username)){ authError('Username must be 3–20 characters: letters, numbers, dot or underscore.'); return; }
  if (accounts.find(a=>a.username===username)){ authError('That username is already taken.'); return; }
  if (!secA){ authError('Please answer the security question so you can recover your account later.'); return; }
  const acc = {username, password:pass, role:'student', fullname, lrn, createdAt:Date.now(), securityQ:secQ, securityA:secA, profilePhoto:'', course:'', yearLevel:'', email:'', contact:'', address:''};
  accounts.push(acc); persistAccounts();
  currentUser = acc; saveSession(username);
  renderCurrentScreen();
  toast('Account created. Welcome!');
}

/* ---------------- forgot password (username -> security question -> reset) ---------------- */
function renderForgotForm(){
  const host = document.getElementById('authFormHost');
  const st = renderForgotForm._state || (renderForgotForm._state = {step:1, acc:null});
  if (st.step===1){
    host.innerHTML = `
      <div id="authErr"></div>
      <div class="field"><label>Username</label><input id="fpUser" type="text" placeholder="Enter your username"></div>
      <button class="btn btn-gold btn-block" id="fpNext">Continue</button>
      <button class="btn btn-block btn-ghost" id="fpBackToLogin" style="margin-top:8px;">Back to Log In</button>
    `;
    document.getElementById('fpNext').onclick = ()=>{
      const u = document.getElementById('fpUser').value.trim().toLowerCase();
      const acc = accounts.find(a=>a.username===u);
      if (!acc){ authError('No account found with that username.'); return; }
      if (!acc.securityQ || !acc.securityA){ authError('This account has no recovery question on file. Please ask the librarian to reset it for you.'); return; }
      st.acc = acc; st.step = 2;
      renderForgotForm();
    };
    document.getElementById('fpBackToLogin').onclick = ()=>{ renderForgotForm._state=null; renderAuth('login'); };
  } else if (st.step===2){
    host.innerHTML = `
      <div id="authErr"></div>
      <div class="field"><label>${esc(st.acc.securityQ)}</label><input id="fpAnswer" type="text" placeholder="Your answer"></div>
      <button class="btn btn-gold btn-block" id="fpVerify">Verify Answer</button>
      <button class="btn btn-block btn-ghost" id="fpBack" style="margin-top:8px;">Back</button>
    `;
    document.getElementById('fpVerify').onclick = ()=>{
      const ans = document.getElementById('fpAnswer').value.trim().toLowerCase();
      if (!ans || ans !== (st.acc.securityA||'').trim().toLowerCase()){ authError('That answer does not match our records.'); return; }
      st.step = 3;
      renderForgotForm();
    };
    document.getElementById('fpBack').onclick = ()=>{ st.step=1; renderForgotForm(); };
  } else {
    host.innerHTML = `
      <div id="authErr"></div>
      <div class="field"><label>New Password</label><input id="fpNew" type="password" placeholder="••••••••"></div>
      <div class="field"><label>Confirm New Password</label><input id="fpConfirm" type="password" placeholder="••••••••"></div>
      <button class="btn btn-gold btn-block" id="fpSave">Reset Password</button>
    `;

function returnLoan(loanId, host){
  const l = loans.find(x=>x.id===loanId);

  l.returnedAt = Date.now(); persistLoans();

  renderMyLoans(host);
  renderMasthead();
}

/* Animates a stat number counting up from 0 to its target value. */
function animateCount(el, target){
  if (target<=0){ el.textContent = '0'; return; }
  const duration = Math.min(900, 300 + target*18);
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(eased*target);
    if (p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function openBookForm(b, host){
  const editing = !!b;
  let pendingCover = b ? (b.coverUrl || null) : null;
  openModal(`
    <h3>${editing?'Edit Book':'Add Book'}</h3>
    <div id="bfErr"></div>
    <div class="field">
      <label>Cover Photo (optional)</label>
      <div class="cover-upload-row">
        <div class="cover-upload-preview" id="bfCoverPreview">${pendingCover?`<img src="${pendingCover}" alt="">`:`<svg viewBox="0 0 20 16" fill="currentColor">${PLACEHOLDER_ICON}</svg>`}</div>
        <div class="cover-upload-controls">
          <input type="file" id="bfCoverFile" accept="image/*">
          <button type="button" class="btn btn-sm btn-ghost" id="bfCoverClear" ${pendingCover?'':'style="display:none;"'}>Remove photo</button>
          <div class="hint">JPG or PNG. Resized automatically.</div>
        </div>
      </div>
    </div>
    <div class="field"><label>Title</label><input id="bfTitle" value="${esc(b?b.title:'')}"></div>
    <div class="field"><label>Author</label><input id="bfAuthor" value="${esc(b?b.author:'')}"></div>
    <div class="field-row">
      <div class="field"><label>Category</label><input id="bfCat" value="${esc(b?b.category:'')}" placeholder="Theology / Education / Business / Nursing"></div>
      <div class="field"><label>Total copies</label><input id="bfCopies" type="number" min="1" value="${b?b.copies:1}"></div>
    </div>
    <div class="field"><label>Description</label><textarea id="bfDesc" rows="3" placeholder="Short description of the book">${esc(b?b.description:'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn" id="modalCloseBtn">Cancel</button>
      <button class="btn btn-gold" id="bfSave">${editing?'Save Changes':'Add Book'}</button>
    </div>
  `);
  const preview = document.getElementById('bfCoverPreview');
  const clearBtn = document.getElementById('bfCoverClear');
  document.getElementById('bfCoverFile').onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    try{
      pendingCover = await readAndResizeImage(file);
      preview.innerHTML = `<img src="${pendingCover}" alt="">`;
      clearBtn.style.display = '';
    }catch(err){
      document.getElementById('bfErr').innerHTML = `<div class="err">Could not read that image. Try a different file.</div>`;
    }
  };
  clearBtn.onclick = ()=>{
    pendingCover = null;
    preview.innerHTML = `<svg viewBox="0 0 20 16" fill="currentColor">${PLACEHOLDER_ICON}</svg>`;
    clearBtn.style.display = 'none';
    document.getElementById('bfCoverFile').value = '';
  };
  document.getElementById('bfSave').onclick = ()=>{
    const title = document.getElementById('bfTitle').value.trim();
    const author = document.getElementById('bfAuthor').value.trim();
    const category = document.getElementById('bfCat').value.trim() || 'General';
    const description = document.getElementById('bfDesc').value.trim() || `${title} — a library title available for JRCC students.`;
    const copies = Math.max(1, Number(document.getElementById('bfCopies').value)||1);
    if (!title || !author){ document.getElementById('bfErr').innerHTML = `<div class="err">Title and author are required.</div>`; return; }
    if (editing){
      const borrowedOut = b.copies - b.available;
      b.title=title; b.author=author; b.category=category; b.description=description; b.copies=copies;
      b.available = Math.max(0, copies - borrowedOut);
      b.coverUrl = pendingCover;
    } else {
      books.push({id:uid('b'), title, author, category, description, copies, available:copies, coverUrl:pendingCover, createdAt:Date.now()});
    }
    persistBooks();
    closeModal();
    toast(editing?'Book updated.':'Book added.');
    renderAdminBooks(host);
  };
}

/* ================= MODAL ================= */
function openModal(html){
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop'; bd.id = 'modalBackdrop';
  bd.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bd);
  bd.addEventListener('click', e=>{ if(e.target===bd) closeModal(); });
  const closeBtn = document.getElementById('modalCloseBtn');
  if (closeBtn) closeBtn.onclick = closeModal;
}
function closeModal(){ const bd=document.getElementById('modalBackdrop'); if(bd) bd.remove(); }

/* Keep open student/admin tabs synchronized when localStorage changes. */
window.addEventListener('storage', (event)=>{
  if(!event.key) return;
  if(event.key==='jrcc_announcements') announcements=load('jrcc_announcements',[]);
  if(event.key==='jrcc_loans') loans=load('jrcc_loans',[]);
  if(event.key==='jrcc_accounts') accounts=load('jrcc_accounts',[]);
  if(event.key==='jrcc_books') books=load('jrcc_books',books);
  if(currentUser && document.visibilityState!=='hidden') renderCurrentScreen();
});

/* ================= BOOT ================= */
function boot(){
  const savedUser = loadSession();
  if (savedUser){
    const acc = accounts.find(a=>a.username===savedUser);
    if (acc) currentUser = acc; else clearSession();
  }
  renderCurrentScreen();
}
boot();

})();
